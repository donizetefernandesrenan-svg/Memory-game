<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da memória</title>
</head>
<!-- Link para o arquivo de estilização do CSS -->
<link rel="stylesheet" href="css/styles.css">

<body>   
  <section class="header">
    <h1>Jogo da memória</h1>
    <button id="start">Iniciar</button>
    <span id="timer">00:00</span>  
  </section>

  <!-- Início do container principal -->
  <section class="memory-game">    
  
    <!-- Início das seções dos cards - 12 cards (cartões)-->
    <section class="memory-card" data-framework="spider_man">
      <!-- O que são Data Attributes?
        São atributos criados por você no HTML para guardar informações extras em uma tag 
        sem precisar criar classes ou IDs.Exemplo no HTML:<div data-status="ativo" 
        data-cor="azul">Texto</div>-->
      <img class="front-face" src="img/back.svg" alt="avengers" />
      <img class="back-face" src="img/batman.png" alt="Spider Man" />
    </section>

    <section class="memory-card" data-framework="black_panther">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/superman.png" alt="Black Panther" />
    </section>

    <section class="memory-card" data-framework="captain_america">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/lanternaverde.jpg" alt="Captain America" />
    </section>

    <section class="memory-card" data-framework="iron_man">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/mulhermaravilha.jpg" alt="Iron Man" />
    </section>

    <section class="memory-card" data-framework="deadpool">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/flash.png" alt="DeadPool Man" />
    </section>

    <section class="memory-card" data-framework="wolverine">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/aquaman.png" alt="Wolverine" />
    </section>

    <section class="memory-card" data-framework="wolverine">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/aquaman.png" alt="Wolverine" />
    </section>

    <section class="memory-card" data-framework="captain_america">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/lanternaverde.jpg" alt="Captain America" />
    </section>

    <section class="memory-card" data-framework="iron_man">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/mulhermaravilha.jpg" alt="Iron Man" />
    </section>

    <section class="memory-card" data-framework="black_panther">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/superman.png" alt="Black Panther" />
    </section>

    <section class="memory-card" data-framework="deadpool">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/flash.png" alt="DeadPool" />
    </section>

    <section class="memory-card" data-framework="spider_man">
      <img class="front-face" src="img/back.svg" alt="Avengers" />
      <img class="back-face" src="img/batman.png" alt="Spider man" />
    </section>
    <!-- Fim das seções dos cards-->

  </section>
  <!-- Fim do container principal -->

  <!-- Link para o arquivo Javascript, que será iniciado na próxima semana -->
  <script src="js/scripts.js"></script>
</body>
</html>
